<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Personalized Independence Day Greeting | Shree Venkateshwara Group of Institutions</title>
  <meta name="description" content="Personalized 80th Independence Day digital greeting poster. Shree Venkateshwara Group of Institutions.">
  <meta name="theme-color" content="#060a17">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇳</text></svg>">
</head>
<body>

  <!-- Top Tricolor Accent Line -->
  <div class="bg-tricolor-line"></div>

  <!-- Background Ambient Glow Layer -->
  <div class="bg-ambient-layer">
    <div class="bg-ambient-beam"></div>
  </div>

  <!-- Confetti Canvas for Celebratory Effect -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Hidden HD Canvas for Rendering & Downloading -->
  <canvas id="exportCanvas"></canvas>

  <!-- App Header & Branding -->
  <header class="app-header">
    <div class="institution-badge">
      <svg class="badge-emblem-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L1 21h22L12 2zm0 3.84L19.5 19H4.5L12 5.84zM11 10h2v4h-2zm0 6h2v2h-2z"/>
      </svg>
      <span>Knowledge • Innovation • Excellence</span>
    </div>
    <h1 class="institution-name">Shree Venkateshwara Group of Institutions</h1>
    <p class="institution-sub">Othakuthirai &bull; Gobi</p>
  </header>

  <!-- Main Showcase Container -->
  <main class="greeting-view-container">
    
    <!-- Top Action Bar -->
    <div class="greeting-top-bar">
      <button type="button" class="btn-back-link" onclick="handleCreateAnother()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Create Another</span>
      </button>

      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Greeting Ready</span>
      </div>
    </div>

    <!-- Personalized Poster Wrapper -->
    <div class="poster-showcase-wrapper">
      <div class="poster-frame" id="posterFrame">
        
        <!-- Base Banner Image (Hero Background) -->
        <img 
          src="assets/banner.png" 
          alt="Shree Venkateshwara Group of Institutions Independence Day Banner" 
          class="poster-base-banner"
          id="bannerImageEl"
        />

        <!-- Circular User Photo Overlay (Centered in the Gold Circle) -->
        <div class="banner-photo-circle-overlay" id="bannerPhotoContainer">
          <img id="bannerUserPhoto" src="" alt="Personalized Photo" />
        </div>

        <!-- Personalized User Name Badge Overlay -->
        <div class="banner-name-badge-overlay" id="bannerNameContainer">
          <div class="banner-name-text" id="bannerUserNameDisplay">
            <!-- Populated via JavaScript -->
          </div>
        </div>

      </div>
    </div>

    <!-- Action Buttons Bar -->
    <div class="poster-actions-bar">
      <button type="button" class="btn-action btn-download-hd" id="btnDownloadPoster" onclick="downloadHDPoster()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download Greeting</span>
      </button>

      <button type="button" class="btn-action btn-share" id="btnSharePoster" onclick="sharePoster()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span>Share Poster</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p class="footer-quote">“We may speak different languages, but our hearts beat as one for India”</p>
    <p class="footer-credits">Happy Independence Day &bull; Shree Venkateshwara Group of Institutions</p>
  </footer>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
